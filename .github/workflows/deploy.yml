name: Deploy Digital Twin

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # TEMPORARY: remove once OIDC is working
      - name: Debug OIDC
        continue-on-error: true
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ secrets.DEFAULT_AWS_REGION }}
        run: |
          set -uo pipefail

          echo "::group::Secret shape"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID    : EMPTY"
          elif printf '%s' "$ACCOUNT_ID" | grep -Eq '^[0-9]{12}$'; then
            echo "AWS_ACCOUNT_ID    : 12 digits, no stray characters"
          else
            echo "AWS_ACCOUNT_ID    : ${#ACCOUNT_ID} characters, NOT 12 plain digits"
          fi

          if [ -z "$REGION" ]; then
            echo "DEFAULT_AWS_REGION: EMPTY"
          else
            echo "DEFAULT_AWS_REGION: $REGION"
          fi

          if [ -z "$ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN      : EMPTY - missing, or not visible to the '${{ github.event.inputs.environment || 'dev' }}' environment"
          else
            echo "AWS_ROLE_ARN      : ${#ROLE_ARN} characters"
            expected="arn:aws:iam::${ACCOUNT_ID}:role/github-actions-twin-deploy"
            if [ "$ROLE_ARN" = "$expected" ]; then
              echo "  exact match against arn:aws:iam::<AWS_ACCOUNT_ID>:role/github-actions-twin-deploy"
            else
              echo "  DOES NOT match arn:aws:iam::<AWS_ACCOUNT_ID>:role/github-actions-twin-deploy"
              echo "    account segment: $([ "$(printf '%s' "$ROLE_ARN" | cut -d: -f5)" = "$ACCOUNT_ID" ] && echo 'matches AWS_ACCOUNT_ID' || echo 'DIFFERENT from AWS_ACCOUNT_ID')"
              echo "    role name      : $(printf '%s' "$ROLE_ARN" | cut -d/ -f2-)"
              printf '%s' "$ROLE_ARN" | grep -q '[[:space:]"]' \
                && echo "    WARNING: contains whitespace or quote characters" \
                || echo "    no stray whitespace or quotes"
            fi
          fi
          echo "::endgroup::"

          echo "::group::OIDC token claims"
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          payload=$(printf '%s' "$TOKEN" | cut -d. -f2)
          case $(( ${#payload} % 4 )) in
            2) payload="$payload==" ;;
            3) payload="$payload=" ;;
          esac
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d \
            | jq '{iss, aud, sub, repository, repository_owner, ref, environment}'
          echo "::endgroup::"

          echo "::group::Live sts:AssumeRoleWithWebIdentity attempt"
          if [ -z "$ROLE_ARN" ]; then
            echo "skipped - no role ARN to try"
          elif aws sts assume-role-with-web-identity \
                 --role-arn "$ROLE_ARN" \
                 --role-session-name oidc-debug \
                 --web-identity-token "$TOKEN" \
                 --region "${REGION:-us-east-1}" \
                 --query 'AssumedRoleUser.Arn' --output text; then
            echo "assume-role SUCCEEDED (the ARN above is the session identity)"
          else
            echo "assume-role FAILED - the STS error above is the real reason"
          fi
          echo "::endgroup::"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false  # Important: disable wrapper to get raw outputs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Deployment Script
        run: |
          # Set environment variables for the script
          export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          export DEFAULT_AWS_REGION=${{ secrets.DEFAULT_AWS_REGION }}
          
          # Make script executable and run it
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh ${{ github.event.inputs.environment || 'dev' }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          
      - name: Get Deployment URLs
        id: deploy_outputs
        working-directory: ./terraform
        run: |
          terraform workspace select ${{ github.event.inputs.environment || 'dev' }}
          echo "cloudfront_url=$(terraform output -raw cloudfront_url)" >> $GITHUB_OUTPUT
          echo "api_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw s3_frontend_bucket)" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?DomainName=='${{ steps.deploy_outputs.outputs.frontend_bucket }}.s3-website-${{ secrets.DEFAULT_AWS_REGION }}.amazonaws.com']].Id | [0]" \
            --output text)
          
          if [ "$DISTRIBUTION_ID" != "None" ] && [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id $DISTRIBUTION_ID \
              --paths "/*"
          fi

      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo "🌐 CloudFront URL: ${{ steps.deploy_outputs.outputs.cloudfront_url }}"
          echo "📡 API Gateway: ${{ steps.deploy_outputs.outputs.api_url }}"
          echo "🪣 Frontend Bucket: ${{ steps.deploy_outputs.outputs.frontend_bucket }}"